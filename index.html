    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Volume Profile</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #1e293b;
        --panel-strong: #111827;
        --border: #334155;
        --border-soft: #17202a;
        --text: #f1f5f9;
        --muted: #64748b;
        --gold: #fcd34d;
        --green: #22c55e;
        --red: #ef4444;
        --amber: #f59e0b;
        --purple: #a78bfa;
        --orange: #f97316;
        --blue: #3b82f6;
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        min-height: 100%;
        width: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        overflow-x: hidden;
      }

      body {
        padding: 0;
      }

      #app {
        min-height: 100vh;
        padding: 16px;
        display: flex;
        justify-content: center;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.02),
            transparent 35%
          ),
          var(--bg);
      }

      .page {
        width: min(100%, 640px);
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .header,
      .pills,
      .groups,
      .footer {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .page-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .page-title .brand {
        color: var(--gold);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .page-title .subtitle {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .mode-toggle,
      .segmented {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        overflow: hidden;
      }

      button,
      .pill {
        border: none;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
      }

      .mode-button,
      .segmented button {
        padding: 10px 16px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        white-space: nowrap;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }

      .mode-button.active,
      .segmented button.active {
        background: var(--panel-strong);
        color: var(--text);
      }

      .segmented button:hover,
      .mode-button:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        min-width: 84px;
        border-radius: 10px;
      }

      .pill strong {
        color: inherit;
        font-size: 13px;
        font-weight: 700;
      }

      .pill[data-color="muted"] strong {
        color: var(--muted);
      }

      .pill[data-color="gold"] strong {
        color: var(--gold);
      }
      .pill[data-color="green"] strong {
        color: var(--green);
      }
      .pill[data-color="red"] strong {
        color: var(--red);
      }
      .pill[data-color="amber"] strong {
        color: var(--amber);
      }
      .pill[data-color="purple"] strong {
        color: var(--purple);
      }
      .pill[data-color="blue"] strong {
        color: var(--blue);
      }

      .selectors {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .selector-group {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        scrollbar-width: none;
      }

      .selector-group::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .selector-group button {
        min-width: 72px;
        flex: 1 0 auto;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .selector-group button.active {
        background: var(--panel-strong);
        color: var(--text);
      }

      .refresh-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        transition:
          opacity 0.2s ease,
          background 0.2s ease;
      }

      .refresh-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .histogram-card {
        display: flex;
        flex-direction: column;
      }

      .histogram-row {
        display: flex;
        align-items: center;
        height: 17px;
        margin-bottom: 3px;
        cursor: default;
        transition: opacity 0.15s ease;
      }

      .va-strip {
        width: 4px;
        height: 13px;
        margin-right: 4px;
        flex-shrink: 0;
      }

      .price-cell {
        width: 62px;
        text-align: right;
        padding-right: 10px;
        font-size: 11px;
        flex-shrink: 0;
        font-family: monospace;
        white-space: nowrap;
      }

      .bar-cell {
        position: relative;
        height: 13px;
        width: 260px;
        background: #1e293b;
        border-radius: 2px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .bar-segment {
        position: absolute;
        top: 0;
        height: 100%;
      }

      .bar-indicator {
        position: absolute;
        right: -1px;
        top: 50%;
        transform: translateY(-50%);
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 5px solid #22c55e;
        pointer-events: none;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 4px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.2;
        min-width: 120px;
      }

      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .volume-cell {
        padding-left: 8px;
        font-size: 10px;
        min-width: 58px;
        font-family: monospace;
        white-space: nowrap;
      }

      .delta-cell {
        font-size: 9px;
        min-width: 46px;
        font-family: monospace;
        white-space: nowrap;
      }

      .time-control {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .time-tabs {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }

      .time-tab {
        flex: 1;
        padding: 6px 10px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        border: none;
        border-radius: 0;
        cursor: pointer;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .time-tab.active {
        background: var(--panel-strong);
        color: var(--text);
      }

      .time-tab:hover:not(.active) {
        background: rgba(255, 255, 255, 0.04);
      }

      .duration-row {
        display: flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }

      .adj-btn {
        width: 36px;
        height: 36px;
        background: var(--panel-strong);
        border: none;
        border-radius: 0;
        color: var(--text);
        font-size: 18px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s ease;
      }

      .adj-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .dur-display {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        font-family: monospace;
        padding: 0 8px;
        user-select: none;
      }

      .time-stepper-row {
        display: flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }

      .stepper-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.06em;
        padding: 0 8px 0 12px;
        text-transform: uppercase;
        flex-shrink: 0;
        user-select: none;
        min-width: 42px;
      }

      .status-bar {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }

      .note {
        color: rgba(255, 255, 255, 0.4);
        font-size: 11px;
        line-height: 1.6;
      }

      @media (max-width: 720px) {
        .mode-button,
        .segmented button {
          padding: 10px 14px;
        }

        .header,
        .pills,
        .selectors,
        .footer {
          justify-content: center;
        }
      }
    </style>
  </head>

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function formatStockholm(date) {
        return new Intl.DateTimeFormat("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Europe/Stockholm",
          hour12: false,
        }).format(date);
      }

      function formatDuration(minutes) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return `${h}h ${String(m).padStart(2, "0")}m`;
      }

      function formatHHMM(totalMinutes) {
        const clamped = Math.max(0, Math.min(1439, totalMinutes));
        const h = Math.floor(clamped / 60);
        const m = clamped % 60;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      }

      function hhmmToMinutes(hhmm) {
        const [h, m] = hhmm.split(":").map(Number);
        return h * 60 + m;
      }

      function getStockholmMinutes() {
        return hhmmToMinutes(formatStockholm(new Date()));
      }

      function parseStockholmTime(hhmm) {
        const parts = hhmm.split(":");
        if (parts.length !== 2) return new Date();
        const hh = parseInt(parts[0], 10);
        const mm = parseInt(parts[1], 10);
        if (isNaN(hh) || isNaN(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59)
          return new Date();
        const now = new Date();
        const dateStr = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Stockholm",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(now);
        // Determine Stockholm UTC offset by probing noon UTC
        const probeUTC = new Date(`${dateStr}T12:00:00Z`);
        const stkHour = parseInt(
          new Intl.DateTimeFormat("en-US", {
            timeZone: "Europe/Stockholm",
            hour: "2-digit",
            hour12: false,
          }).format(probeUTC),
        );
        const offsetHours = stkHour - 12; // +1 (winter) or +2 (summer)
        const [y, mo, d] = dateStr.split("-").map(Number);
        return new Date(Date.UTC(y, mo - 1, d, hh - offsetHours, mm, 0, 0));
      }

      function getStartTime() {
        if (state.inputMode === "duration") {
          return new Date(Date.now() - state.durationMinutes * 60 * 1000);
        }
        return parseStockholmTime(state.manualStart);
      }

      function getCutoffTime() {
        if (state.inputMode === "duration" || !state.manualEnd) {
          return new Date();
        }
        return parseStockholmTime(state.manualEnd);
      }

      function getSessionLabel() {
        const start = getStartTime();
        const end = getCutoffTime();
        if (state.inputMode === "duration") {
          return `${formatDuration(state.durationMinutes)} · ${formatStockholm(start)}–${formatStockholm(end)}`;
        }
        return `${state.manualStart}–${state.manualEnd ?? "Now"} Stockholm`;
      }

      function formatNumber(value) {
        return new Intl.NumberFormat("en-US").format(value);
      }

      function hasLiveKey() {
        return (
          SUPABASE_ANON_KEY &&
          !SUPABASE_ANON_KEY.includes("REPLACE_WITH_ANON_KEY") &&
          !SUPABASE_ANON_KEY.includes("REPLACE_WITH")
        );
      }

      function computeSummary(profile, meta) {
        const rows = (profile || []).map((r) => ({ ...r }));
        if (!rows.length) {
          return {
            rows: [],
            maxVol: 1,
            maxVel: 1,
            p70: 0,
            vah: 0,
            val: 0,
            currentBucket: null,
            pocBucket: null,
            avgVel: 0,
          };
        }

        const maxVol = Math.max(...rows.map((r) => r.total_volume));
        const sortedVolumes = [...rows]
          .map((r) => r.total_volume)
          .sort((a, b) => a - b);
        const p70 = sortedVolumes[Math.floor(sortedVolumes.length * 0.7)] || 0;

        rows.forEach((r) => {
          if (state.mode === "VEL" && r.total_volume < p70) {
            r.velocity = 0;
          }
        });

        const maxVel = Math.max(...rows.map((r) => r.velocity));
        const velRows = rows.filter((r) => r.velocity > 0);
        const avgVel = velRows.length
          ? velRows.reduce((sum, r) => sum + r.velocity, 0) / velRows.length
          : 0;

        const totalVolume =
          meta?.total_session_volume ||
          rows.reduce((sum, r) => sum + r.total_volume, 0);
        const vaSet = new Set();
        let acc = 0;
        rows
          .slice()
          .sort((a, b) => b.total_volume - a.total_volume)
          .forEach((row) => {
            if (acc < totalVolume * 0.7) {
              acc += row.total_volume;
              vaSet.add(row.bucket);
            }
          });

        const vah = Math.max(
          ...rows.filter((r) => vaSet.has(r.bucket)).map((r) => r.bucket),
          0,
        );
        const val = Math.min(
          ...rows.filter((r) => vaSet.has(r.bucket)).map((r) => r.bucket),
          0,
        );
        const currentBucket = rows.reduce((best, r) => {
          if (best === null) return r;
          return Math.abs(r.bucket - meta.cutoff_price) <
            Math.abs(best.bucket - meta.cutoff_price)
            ? r
            : best;
        }, null)?.bucket;
        const pocBucket =
          state.mode === "VOL"
            ? meta?.poc
              ? rows.find((r) => r.bucket === meta.poc)?.bucket ||
                rows.reduce(
                  (best, r) =>
                    !best || r.total_volume > best.total_volume ? r : best,
                  rows[0],
                ).bucket
              : rows.reduce(
                  (best, r) =>
                    !best || r.total_volume > best.total_volume ? r : best,
                  rows[0],
                ).bucket
            : rows.reduce(
                (best, r) => (!best || r.velocity > best.velocity ? r : best),
                rows[0],
              ).bucket;

        rows.forEach((r) => {
          r.isVA = vaSet.has(r.bucket);
          r.isCurrent = r.bucket === currentBucket;
          r.isPOC = r.bucket === pocBucket;
        });

        return {
          rows,
          maxVol,
          maxVel,
          p70,
          vah,
          val,
          currentBucket,
          pocBucket,
          avgVel,
          totalVolume,
        };
      }

      function getRowColors(row, summary) {
        if (row.isCurrent) {
          return {
            left: "rgba(34,197,94,0.96)",
            right: "rgba(22,163,74,0.96)",
          };
        }
        if (row.isPOC) {
          return {
            left: "rgba(245,158,11,0.92)",
            right: "rgba(217,119,6,0.92)",
          };
        }

        if (state.mode === "VOL") {
          if (row.delta_pct < -8) {
            return {
              left: "rgba(127,29,29,0.6)",
              right: "rgba(239,68,68,0.8)",
            };
          }
          if (row.delta_pct > 6) {
            return {
              left: "rgba(59,130,246,0.8)",
              right: "rgba(29,78,216,0.8)",
            };
          }
          return {
            left: "rgba(59,130,246,0.22)",
            right: "rgba(100,116,139,0.6)",
          };
        }

        if (row.velocity === 0) {
          return { left: "rgba(30,41,59,0.18)", right: "rgba(30,41,59,0.18)" };
        }

        const pct = row.velocity / Math.max(summary.maxVel, 1);
        if (pct > 0.6) {
          return {
            left: "rgba(249,115,22,0.8)",
            right: "rgba(249,115,22,0.8)",
          };
        }
        if (pct > 0.3) {
          return {
            left: "rgba(245,158,11,0.55)",
            right: "rgba(245,158,11,0.55)",
          };
        }
        return { left: "rgba(59,130,246,0.4)", right: "rgba(59,130,246,0.4)" };
      }

      function render() {
        state.sessionLabel = getSessionLabel();
        const summary = computeSummary(state.profile, state.meta);

        app.innerHTML = `
        <div class="page" aria-live="polite">
          <div class="header">
            <div class="page-title">
              <div class="brand">Volume Profile</div>
              <div class="subtitle">${state.meta.instrument || instruments[state.instrument].label} · ${state.sessionLabel}</div>
            </div>
            <div class="mode-toggle" role="group" aria-label="Mode switch">
              <button class="mode-button ${state.mode === "VOL" ? "active" : ""}" data-mode="VOL">VOL</button>
              <button class="mode-button ${state.mode === "VEL" ? "active" : ""}" data-mode="VEL">VEL</button>
            </div>
          </div>



          <div class="selectors">
            <div class="selector-group" role="group" aria-label="Instruments">
              ${Object.keys(instruments)
                .map(
                  (key) => `
                <button class="${state.instrument === key ? "active" : ""}" data-instrument="${key}">${instruments[key].label}</button>
              `,
                )
                .join("")}
            </div>
            <div class="time-control">
              <div class="time-tabs" role="group" aria-label="Time input mode">
                <button class="time-tab ${state.inputMode === "duration" ? "active" : ""}" data-input-mode="duration">Duration</button>
                <button class="time-tab ${state.inputMode === "time" ? "active" : ""}" data-input-mode="time">Time</button>
              </div>
              ${state.inputMode === "duration" ? `
              <div class="duration-row">
                <button class="adj-btn" data-action="dur-minus">−</button>
                <span class="dur-display">${formatDuration(state.durationMinutes)}</span>
                <button class="adj-btn" data-action="dur-plus">+</button>
              </div>
              ` : `
              <div class="time-stepper-row">
                <span class="stepper-label">Start</span>
                <button class="adj-btn" data-action="start-minus">−</button>
                <span class="dur-display">${state.manualStart}</span>
                <button class="adj-btn" data-action="start-plus">+</button>
              </div>
              <div class="time-stepper-row">
                <span class="stepper-label">End</span>
                <button class="adj-btn" data-action="end-minus">−</button>
                <span class="dur-display">${state.manualEnd ?? "Now"}</span>
                <button class="adj-btn" data-action="end-plus">+</button>
              </div>
              `}
            </div>
            <button class="refresh-button" data-action="refresh" ${state.loading ? "disabled" : ""}>${state.loading ? "Refreshing…" : "Refresh"}</button>
          </div>

          <div class="histogram-card">
            <div id="histogram" aria-label="Histogram rows">
              ${summary.rows
                .map((row) => {
                  const colors = getRowColors(row, summary);
                  const isCur = row.isCurrent;
                  const isPoc = row.isPOC;
                  const isVA  = row.isVA;
                  const totalWidth = state.mode === "VOL"
                    ? Math.round((row.total_volume / Math.max(summary.maxVol, 1)) * 260)
                    : Math.round((row.velocity / Math.max(summary.maxVel, 1)) * 260);
                  const bullW = state.mode === "VOL" && row.total_volume > 0
                    ? Math.round((row.bull_vol / row.total_volume) * totalWidth)
                    : totalWidth;
                  const bearW = state.mode === "VOL" ? totalWidth - bullW : 0;
                  const priceColor = isCur ? "#22c55e" : isPoc ? (state.mode === "VOL" ? "#f59e0b" : "#f97316") : isVA ? "#c4b5fd" : "#64748b";
                  const priceFW   = isCur || isPoc ? "700" : "400";
                  const volColor  = isCur ? "#22c55e" : isPoc ? (state.mode === "VOL" ? "#f59e0b" : "#f97316") : "#475569";
                  const volFW     = isCur || isPoc ? "700" : "400";
                  const deltaColor = state.mode === "VOL" ? (row.delta_pct > 0 ? "#3b82f6" : row.delta_pct < 0 ? "#ef4444" : "#475569") : "#475569";
                  return `
                  <div class="histogram-row" data-bucket="${row.bucket}">
                    <div class="va-strip" style="border-left:${isVA ? "2px solid rgba(167,139,250,0.4)" : "2px solid transparent"}; background:${isVA ? "rgba(167,139,250,0.13)" : "transparent"}"></div>
                    <div class="price-cell" style="color:${priceColor}; font-weight:${priceFW}">${row.bucket.toFixed(1)}</div>
                    <div class="bar-cell">
                      <div class="bar-segment" style="left:0; width:${bullW}px; background:${colors.left}; border-radius:2px 0 0 2px"></div>
                      ${state.mode === "VOL" ? `<div class="bar-segment" style="left:${bullW}px; width:${bearW}px; background:${colors.right}; border-radius:${bearW > 0 ? "0 2px 2px 0" : "0"}"></div>` : ""}
                      ${isCur ? '<div class="bar-indicator"></div>' : ""}
                    </div>
                    <div class="volume-cell" style="color:${volColor}; font-weight:${volFW}">${state.mode === "VOL" ? formatNumber(row.total_volume) : row.velocity > 0 ? row.velocity.toFixed(2) + "t/s" : "-"}</div>
                    <div class="delta-cell" style="color:${deltaColor}">${state.mode === "VOL" ? (row.delta_pct > 0 ? "+" : "") + row.delta_pct.toFixed(1) + "%" : row.velocity > 0 ? formatNumber(row.total_volume) : ""}</div>
                  </div>
                `;
                })
                .join("")}
            </div>
          </div>

          <div class="footer note">
            ${state.loading ? "Loading live volume profile…" : state.error ? `Unable to load live data: ${state.error}` : "VOL = volume at price · VEL = ticks/sec (P70 filter applied) · Bucket sizes: GC/ES 1.2, CL 0.12"}
          </div>
        </div>
      `;

        bindInteractions();
      }

      function bindInteractions() {
        app.querySelectorAll("[data-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            state.mode = button.dataset.mode;
            render();
          });
        });

        app.querySelectorAll("[data-instrument]").forEach((button) => {
          button.addEventListener("click", () => {
            state.instrument = button.dataset.instrument;
            state.meta = SAMPLE_META;
            state.profile = SAMPLE_PROFILE;
            loadProfile();
            render();
          });
        });

        app.querySelectorAll("[data-input-mode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.inputMode = btn.dataset.inputMode;
            if (btn.dataset.inputMode === "time") {
              const stkHour = parseInt(formatStockholm(new Date()).split(":")[0]);
              const h = ((stkHour - 5) + 24) % 24;
              state.manualStart = `${String(h).padStart(2, "0")}:00`;
              state.manualEnd = null;
            }
            render();
            loadProfile();
          });
        });

        const durMinus = app.querySelector('[data-action="dur-minus"]');
        const durPlus = app.querySelector('[data-action="dur-plus"]');
        if (durMinus) {
          durMinus.addEventListener("click", () => {
            state.durationMinutes = Math.max(15, state.durationMinutes - 15);
            render();
            loadProfile();
          });
        }
        if (durPlus) {
          durPlus.addEventListener("click", () => {
            state.durationMinutes = Math.min(1440, state.durationMinutes + 15);
            render();
            loadProfile();
          });
        }

        const startMinus = app.querySelector('[data-action="start-minus"]');
        const startPlus  = app.querySelector('[data-action="start-plus"]');
        const endMinus   = app.querySelector('[data-action="end-minus"]');
        const endPlus    = app.querySelector('[data-action="end-plus"]');

        if (startMinus) {
          startMinus.addEventListener("click", () => {
            const min = hhmmToMinutes(state.manualStart);
            state.manualStart = formatHHMM(Math.max(0, min - 15));
            render(); loadProfile();
          });
        }
        if (startPlus) {
          startPlus.addEventListener("click", () => {
            const min = hhmmToMinutes(state.manualStart);
            const endMin = state.manualEnd ? hhmmToMinutes(state.manualEnd) : getStockholmMinutes();
            state.manualStart = formatHHMM(Math.min(endMin - 15, min + 15));
            render(); loadProfile();
          });
        }
        if (endMinus) {
          endMinus.addEventListener("click", () => {
            const curMin = state.manualEnd ? hhmmToMinutes(state.manualEnd) : getStockholmMinutes();
            const newMin = curMin - 15;
            if (newMin > hhmmToMinutes(state.manualStart)) {
              state.manualEnd = formatHHMM(newMin);
              render(); loadProfile();
            }
          });
        }
        if (endPlus) {
          endPlus.addEventListener("click", () => {
            if (!state.manualEnd) return; // already "Now"
            const newMin = hhmmToMinutes(state.manualEnd) + 15;
            state.manualEnd = newMin >= getStockholmMinutes() ? null : formatHHMM(newMin);
            render(); loadProfile();
          });
        }

        const refreshButton = app.querySelector('[data-action="refresh"]');
        if (refreshButton) {
          refreshButton.addEventListener("click", () => {
            loadProfile();
          });
        }

      }

      async function loadProfile() {
        state.loading = true;
        state.error = null;
        render();

        if (!hasLiveKey()) {
          state.error =
            "Sample mode is active. Add a valid SUPABASE_ANON_KEY in index.html to enable live Supabase data.";
          state.loading = false;
          render();
          return;
        }

        const instrument = instruments[state.instrument];
        const startTime = getStartTime();
        const cutoffTime = getCutoffTime();

        try {
          const { data, error } = await supabase.rpc("get_volume_profile", {
            p_instrument: instrument.pattern,
            p_start_time: startTime.toISOString(),
            p_cutoff_time: cutoffTime.toISOString(),
            p_brick_size: 4,
            p_bucket_size: instrument.bucketSize,
          });

          if (error) {
            throw error;
          }

          if (data?.meta && Array.isArray(data.profile)) {
            state.meta = data.meta;
            state.profile = data.profile;
          } else {
            throw new Error("Unexpected response format");
          }
        } catch (err) {
          state.error = err.message || String(err);
        } finally {
          state.loading = false;
          render();
        }
      }

      render();
      window.addEventListener("load", loadProfile);
    </script>
  </body>
</html>
